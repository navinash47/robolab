[project]
name = "robolab-eval"
version = "0.1.0"
description = "RoboLab evaluation package (stubs in Phase 0)"
requires-python = ">=3.11"
dependencies = [
    "robolab",
]

[tool.uv.sources]
robolab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robolab_eval"]
