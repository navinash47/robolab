[project]
name = "robolab-api"
version = "0.1.0"
description = "RoboLab FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "robolab",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
robolab-api = "robolab_api.main:run"

[tool.uv.sources]
robolab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robolab_api"]
