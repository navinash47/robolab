[project]
name = "robolab"
version = "0.1.0"
description = "RoboLab core library"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.1",
    "mujoco>=3.2.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "wandb>=0.22.3",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "efficient-kan",
    "runpod>=1.7.0",
    # Required by Gymnasium RecordVideo (gymnasium[other]); Phase 4 playback.
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.5.0",
]

[project.scripts]
robolab-train = "robolab.train.trainer:main"
robolab-render = "robolab.train.render_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robolab"]

[tool.hatch.build.targets.wheel.force-include]
"robolab/robots" = "robolab/robots"

[tool.uv.sources]
efficient-kan = { git = "https://github.com/Blealtan/efficient-kan.git" }
