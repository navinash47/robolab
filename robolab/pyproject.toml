[project]
name = "robolab"
version = "0.1.0"
description = "RoboLab core library"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.1",
    "mujoco>=3.2.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "wandb>=0.22.3",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[project.scripts]
robolab-train = "robolab.train.trainer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robolab"]

[tool.hatch.build.targets.wheel.force-include]
"robolab/robots" = "robolab/robots"